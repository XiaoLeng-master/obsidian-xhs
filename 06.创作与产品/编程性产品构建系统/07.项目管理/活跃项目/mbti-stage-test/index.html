<!DOCTYPE html>
<html lang="zh-CN">
<head>

<title>16人格心智阶段深度测试</title>
<style>
:root{--r:16px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;background:#f0f2f5;min-height:100vh;display:flex;justify-content:center;padding:0}
#app{width:min(700px, 100vw);padding:20px 0 40px;margin:0 auto}
.screen{display:none}.screen.active{display:block}
.card{background:#fff;border-radius:var(--r);padding:28px 24px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.fade-in{animation:fadeIn .4s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* Type Selection */
.type-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}
.type-btn{border:2px solid #e5e7eb;border-radius:12px;padding:14px 4px;text-align:center;cursor:pointer;transition:.2s;background:#fff;font-size:13px;font-weight:600;color:#555}
.type-btn:hover{border-color:#6366f1;background:#faf5ff}
.type-btn.sel{border-color:#6366f1;background:#ede9fe;color:#5b21b6;transform:scale(1.03)}
.type-sub{font-size:11px;color:#999;display:block;margin-top:2px}
.guide-text{font-size:14px;color:#888;line-height:1.8;margin:12px 0}
.guide-link{color:#6366f1;text-decoration:underline}

/* Quiz */
.progress-wrap{margin-bottom:20px}
.progress-bar{height:10px;background:#e5e7eb;border-radius:5px;overflow:hidden;transition:.3s}
.progress-fill{height:100%;border-radius:5px;transition:width .5s ease}
.progress-info{display:flex;justify-content:space-between;margin-top:6px;font-size:12px;color:#999}
.progress-milestone{display:none;text-align:center;padding:12px 20px;background:#fefce8;border-radius:12px;margin:12px 0;font-size:14px;color:#a16207;animation:fadeIn .4s ease}
.progress-milestone.show{display:block}
.milestone-emoji{font-size:24px;display:block;margin-bottom:4px}

.question-text{font-size:18px;color:#111;line-height:1.8;text-align:center;padding:8px 0 20px;font-weight:500}
.question-context{font-size:13px;color:#999;text-align:center;margin-top:-12px;margin-bottom:16px;font-style:italic}
.options{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.opt-btn{border:2px solid #e5e7eb;border-radius:12px;padding:16px 12px;cursor:pointer;text-align:center;font-size:14px;color:#555;transition:.2s;background:#fff;line-height:1.5}
.opt-btn:hover{border-color:var(--accent);background:var(--light)}
.opt-btn.sel{border-color:var(--primary);background:var(--light);color:var(--primary);font-weight:600}
.opt-label{font-size:11px;color:#aaa;display:block;margin-bottom:4px}
@media(max-width:480px){.options{grid-template-columns:1fr}}

/* Result */
.result-header{text-align:center;padding:24px 0}
.result-badge{display:inline-block;padding:6px 20px;border-radius:20px;font-size:14px;font-weight:700;margin-bottom:12px}
.result-type{font-size:32px;font-weight:800;margin-bottom:4px}
.result-quote{font-size:15px;color:#888;font-style:italic;margin:12px 0}
.result-stage-desc{font-size:14px;color:#666;line-height:1.8;padding:16px;background:var(--light);border-radius:12px;margin:12px 0}

.radar-wrap{text-align:center;padding:8px 0}
.radar-wrap canvas{max-width:100%}

.dim-list{margin-top:8px}
.dim-row{display:flex;align-items:center;padding:10px 0;border-bottom:1px solid #f3f4f6}
.dim-icon{font-size:18px;margin-right:8px;min-width:24px}
.dim-name{font-size:14px;font-weight:600;width:72px;flex-shrink:0}
.dim-bar-bg{flex:1;height:10px;background:#e5e7eb;border-radius:5px;margin:0 12px;overflow:hidden}
.dim-bar-fill{height:100%;border-radius:5px;transition:width .8s ease}
.dim-score{font-size:13px;font-weight:700;width:32px;text-align:right}

.insight-section{margin-top:16px}
.insight-section h3{font-size:16px;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.insight-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}

.insight-card{background:var(--light);border-radius:12px;padding:14px;font-size:13px;line-height:1.6}
.insight-card h4{font-size:14px;margin-bottom:4px;color:var(--primary)}
.insight-card p{color:#666}

.actions-grid{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.action-tag{background:var(--light);color:var(--primary);padding:6px 14px;border-radius:20px;font-size:13px}

.btn{width:100%;padding:16px;border:none;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer;text-align:center;margin-top:12px;transition:.2s}
.btn-primary{background:var(--primary,#6366f1);color:#fff}
.btn-primary:hover{opacity:.9}
.btn-secondary{background:#f3f4f6;color:#666}
.btn-secondary:hover{background:#e5e7eb}

h1{font-size:22px;text-align:center;margin-bottom:4px}
.subtitle{text-align:center;color:#999;font-size:13px;margin-bottom:8px}
.text-center{text-align:center}

.milestones{display:flex;justify-content:space-between;padding:8px 0;font-size:11px;color:#ccc}
.milestones span.reached{color:var(--primary);font-weight:700}
</style>
</head>

  '格局视野':'看问题的深度和广度，是否容易被眼前琐事困住',
  '社交电量':'与人交往时能量的流动方式，是消耗还是滋养',
  '心灵富足':'独处时的内心状态，是否能在安静中找到满足感'
};

function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

// ===== TYPE SELECTION =====
function renderTypeSelection(){
  var h='<div class=card><h1>🧠 16人格心智阶段测试</h1>';
  h+='<p class=subtitle>不是测你是什么类型，是测你走到了哪一层</p>';
  h+='<p class=guide-text>这是一套基于荣格认知功能理论的 48 题深度测试。<br>8 个心智维度，不止于标签，更给你成长路径。</p>';
  h+='<p style=font-size:14px;color:#666;margin-top:12px><b>请先确认你的 MBTI 类型</b>（不知道的话可以搜一下免费测试）</p>';
  h+='<div class=type-grid>';
  var groups={analyst:{name:'分析家',types:['INTJ','INTP','ENTJ','ENTP']},diplomat:{name:'外交家',types:['INFJ','INFP','ENFJ','ENFP']},sentinel:{name:'守卫者',types:['ISTJ','ISFJ','ESTJ','ESFJ']},explorer:{name:'探险家',types:['ISTP','ISFP','ESTP','ESFP']}};
  for(var g in groups){
    for(var i=0;i<groups[g].types.length;i++){
      var t=groups[g].types[i];
      h+='<button class=type-btn onclick="selType(\''+t+'\')" id=tb-'+t+'>'+t+'<span class=type-sub>'+QQ[t].typeName+'</span></button>';
    }
  }
  h+='</div><p class=guide-text style=margin-top:16px>不确定类型？<a class=guide-link href=https://qquce.cn/tests/mbti/ target=_blank>点此免费测试 MBTI</a>，测完再回来。</p></div>';
  document.getElementById('s-type').innerHTML=h;
}

function selType(t){
  app.type=t;
  document.querySelectorAll('.type-btn').forEach(b=>b.classList.remove('sel'));
  document.getElementById('tb-'+t).classList.add('sel');
  var c=TC[t];
  document.documentElement.style.setProperty('--primary',c.primary);
  document.documentElement.style.setProperty('--light',c.light);
  document.documentElement.style.setProperty('--accent',c.accent);
  setTimeout(function(){startQuiz()},400);
}

// ===== QUIZ =====
function startQuiz(){
  app.qIdx=0;app.ans=new Array(48).fill(-1);app.dimScores={};
  showScreen('s-quiz');
  renderQuiz();
}

function renderQuiz(){
  var q=QQ[app.type].questions[app.qIdx];
  var pct=Math.round((app.qIdx/48)*100);
  var c=TC[app.type];
  var ms='';
  if(MILESTONES.includes(app.qIdx)&&MILESTONE_MSGS[app.qIdx]){
    var m=MILESTONE_MSGS[app.qIdx];
    ms='<div class="progress-milestone show"><span class=milestone-emoji>'+m.e+'</span>'+m.t+'</div>';
  }
  var h='<div class=card fade-in>'+ms;
  h+='<div class=progress-wrap><div class=progress-bar><div class=progress-fill style=width:'+pct+'%;background:'+c.primary+'></div></div>';
  h+='<div class=progress-info><span>第 '+(app.qIdx+1)+'/48 题</span><span>已完成 '+pct+'%</span></div></div>';
  h+='<p class=question-text>'+q.text+'</p>';
  h+='<p class=question-context>'+DIM_DESC[q.dim]+'</p>';
  h+='<div class=options>';
  for(var i=0;i<LIKERT.length;i++){
    h+='<button class="opt-btn'+(app.ans[app.qIdx]===i?' sel':'')+'" onclick="pickAns('+i+')">'+LIKERT[i]+'</button>';
  }
  h+='</div></div>';
  document.getElementById('s-quiz').innerHTML=h;
}

function pickAns(i){
  app.ans[app.qIdx]=i;
  document.querySelectorAll('.opt-btn').forEach((b,j)=>b.classList.toggle('sel',j===i));
  setTimeout(function(){
    if(app.qIdx<47){app.qIdx++;renderQuiz()}
    else{calcResult()}
  },250);
}

// ===== RESULT =====
function calcResult(){
  app.dimScores={};
  var qs=QQ[app.type].questions;
  for(var i=0;i<48;i++){
    var d=qs[i].dim;app.dimScores[d]=(app.dimScores[d]||0)+app.ans[i];
  }
  // Normalize: each dim has 6 questions, max score = 5*6=30, min=0. Convert to 0-100 where higher = better
  var dims=Object.keys(app.dimScores);
  for(var i=0;i<dims.length;i++){
    var raw=app.dimScores[dims[i]]; // sum of LIKERT answers (0=very agree, 4=disagree)
    // Reverse: agree = higher score. Max per 6q = 24, min=0
    var maxPerDim=24,minPerDim=0;
    var norm=Math.round(((maxPerDim-raw)/maxPerDim)*100);
    app.dimScores[dims[i]]=Math.max(5,Math.min(98,norm));
  }
  var avg=Math.round(Object.values(app.dimScores).reduce(function(a,b){return a+b},0)/8);
  renderResult(avg);
}

function renderResult(avg){
  var c=TC[app.type];
  var td=QQ[app.type];
  var label,labelClass,badgeBg;
  if(avg>=70){label='高阶';labelClass='#059669';badgeBg='#d1fae5'}
  else if(avg>=40){label='中阶';labelClass='#2563eb';badgeBg='#dbeafe'}
  else{label='初阶';labelClass='#d97706';badgeBg='#fef3c7'}

  var dims=Object.keys(app.dimScores);
  var sorted=dimScoresSorted();
  var top3=[sorted[0][0],sorted[1][0],sorted[2][0]];
  var bot3=[sorted[5][0],sorted[6][0],sorted[7][0]];

  var stageInsights={
    70:{title:'你已经在高阶了',body:'这不是终点。高阶的真正命题不再是变得更好，而是把已经内化的觉察转化为可以传递的力量。你的下一个阶段是：输出。把你的成长经验写成东西、讲给别人听、做成可以帮到别人的东西。'},
    40:{title:'中阶是最关键的分水岭',body:'你已经能看见自己的模式，但旧习惯和新觉察还在拉锯。这个阶段最怕的不是走错，是停下来反复怀疑自己。中阶的意义不在于你已经完美，而在于你终于可以同时容纳"我已经进步了"和"我还在路上"这两个事实。'},
    0:{title:'初阶不是贬义——每个人都是从这里出发的',body:'你现在最需要的东西不是变强，是被看见。被自己看见。接下来的30天，只做一件事：每天花3分钟记录"今天什么让我产生了情绪"，不分析，只记录。这个习惯本身，就是最好的觉察训练。'}
  };
  var si=avg>=70?stageInsights[70]:avg>=40?stageInsights[40]:stageInsights[0];

  var h='<div class=card fade-in>';
  h+='<div class=result-header>';
  h+='<span class=result-badge style=background:'+badgeBg+';color:'+labelClass+'>'+label+'</span>';
  h+='<div class=result-type style=color:'+c.primary+'">'+td.typeName+' · '+app.type+'</div>';
  h+='<div class=result-quote>综合得分 '+avg+'/100</div>';
  h+='</div>';
  h+='<div class=result-stage-desc><b>'+si.title+'。</b>'+si.body+'</div>';

  // Radar-like bars
  h+='<div class=dim-list>';
  for(var i=0;i<dims.length;i++){
    var d=dims[i],s=app.dimScores[d];
    var isTop=top3.includes(d);
    h+='<div class=dim-row><span class=dim-icon>'+DIM_EMOJI[d]+'</span><span class=dim-name>'+d+'</span>';
    h+='<div class=dim-bar-bg><div class=dim-bar-fill style=width:'+s+'%;background:'+(isTop?c.primary:'#d1d5db')+'></div></div>';
    h+='<span class=dim-score style=color:'+(isTop?c.primary:'#999')+'>'+s+'</span></div>';
  }
  h+='</div>';

  // Top and bottom dimensions
  h+='<div class=insight-section><h3>✨ 优势维度</h3><div class=insight-grid>';
  for(var i=0;i<3;i++){var d=sorted[i][0];h+='<div class=insight-card><h4>'+DIM_EMOJI[d]+' '+d+'</h4><p>'+DIM_DESC[d]+'。你的得分说明在这方面你已经形成了稳定的内在支撑。</p></div>';}
  h+='</div></div>';

  h+='<div class=insight-section><h3>🌱 成长空间</h3><div class=insight-grid>';
  for(var i=5;i<8;i++){var d=sorted[i][0];h+='<div class=insight-card><h4>'+DIM_EMOJI[d]+' '+d+'</h4><p>'+DIM_DESC[d]+'。这是你最值得关注的成长方向。</p></div>';}
  h+='</div></div>';

  // Actions
  h+='<div class=insight-section><h3>💡 接下来可以做的事</h3><div class=actions-grid>';
  var actions=['每天花3分钟记录情绪','在安全的关系里多说一句真话','做决定前先问自己：这是我想要的还是别人期望的','允许自己有不完美的一天','尝试一件你一直想做但觉得还没准备好的事'];
  for(var i=0;i<actions.length;i++)h+='<span class=action-tag>'+actions[i]+'</span>';
  h+='</div></div>';

  h+='<button class="btn btn-primary" onclick="restart()" style=background:'+c.primary+'>🔄 重新测试</button>';
  h+='<p class=text-center style=margin-top:12px;font-size:11px;color:#bbb>本测试仅供娱乐参考，不构成心理或医疗建议</p>';
  h+='</div>';

  document.getElementById('s-result').innerHTML=h;
  showScreen('s-result');
  window.scrollTo(0,0);
}

function dimScoresSorted(){
  return Object.entries(app.dimScores).sort(function(a,b){return b[1]-a[1]});
}

function restart(){app.type='';showScreen('s-type');renderTypeSelection();window.scrollTo(0,0)}

// ===== INIT =====
renderTypeSelection();
</script>
</body>
</html>
