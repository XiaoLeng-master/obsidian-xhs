<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#1a1a2e">
<title>去还是留？城市选择测试</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f5f0eb;
    --card: #ffffff;
    --text: #2c2c2c;
    --sub: #7a7a7a;
    --primary: #e07a5f;
    --primary-dark: #c9654b;
    --stay: #3d5a80;
    --go: #ee6c4d;
    --gold: #e8b44f;
    --progress-bg: #e8ddd0;
    --divider: #f0ebe3;
    --shadow: 0 2px 16px rgba(0,0,0,0.06);
    --radius: 16px;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100dvh;
    display: flex;
    justify-content: center;
    -webkit-font-smoothing: antialiased;
  }
  .app { width: 100%; max-width: 480px; min-height: 100dvh; position: relative; overflow: hidden; }

  /* Progress */
  .progress-wrap { padding: 20px 24px 0; }
  .progress-bar { height: 4px; background: var(--progress-bg); border-radius: 2px; overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--stay), var(--primary), var(--go)); border-radius: 2px; transition: width 0.4s ease; width: 0%; }
  .progress-text { text-align: right; font-size: 12px; color: var(--sub); margin-top: 6px; }

  /* Pages */
  .page { display: none; flex-direction: column; padding: 0 24px 40px; animation: fadeSlideIn 0.35s ease; }
  .page.active { display: flex; }
  @keyframes fadeSlideIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

  /* Landing */
  .landing { text-align: center; padding-top: 60px; align-items: center; }
  .landing-icon { font-size: 56px; margin-bottom: 16px; }
  .landing h1 { font-size: 26px; font-weight: 700; line-height: 1.4; margin-bottom: 10px; color: var(--text); }
  .landing .sub { font-size: 15px; color: var(--sub); line-height: 1.6; margin-bottom: 8px; }
  .landing .hint { font-size: 13px; color: #b0a89a; margin-bottom: 32px; }
  .landing .stats { display: flex; gap: 24px; justify-content: center; margin-bottom: 36px; }
  .landing .stat-num { font-size: 28px; font-weight: 700; color: var(--primary); }
  .landing .stat-label { font-size: 12px; color: var(--sub); margin-top: 2px; }

  /* Buttons */
  .btn {
    display: inline-block; padding: 14px 40px; border-radius: 50px; font-size: 17px; font-weight: 600;
    border: none; cursor: pointer; transition: all 0.2s; text-align: center; letter-spacing: 0.5px;
    -webkit-tap-highlight-color: transparent;
  }
  .btn:active { transform: scale(0.97); }
  .btn-primary { background: var(--primary); color: #fff; box-shadow: 0 4px 14px rgba(224,122,95,0.35); }
  .btn-primary:hover { background: var(--primary-dark); }

  /* Question Card */
  .q-card { background: var(--card); border-radius: var(--radius); padding: 28px 24px 24px; box-shadow: var(--shadow); }
  .q-num { font-size: 12px; color: var(--sub); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; }
  .q-text { font-size: 18px; font-weight: 600; line-height: 1.5; margin-bottom: 24px; color: var(--text); }
  .q-options { display: flex; flex-direction: column; gap: 10px; }
  .q-opt {
    display: block; width: 100%; padding: 14px 18px; border: 1.5px solid var(--divider); border-radius: 12px;
    background: var(--card); font-size: 15px; color: var(--text); text-align: left; cursor: pointer;
    transition: all 0.2s; -webkit-tap-highlight-color: transparent; line-height: 1.5;
  }
  .q-opt:hover, .q-opt:active { border-color: var(--primary); background: #fef8f5; }
  .q-opt.selected { border-color: var(--primary); background: #fef3ee; font-weight: 500; }

  /* Results */
  .result { text-align: center; padding-top: 30px; align-items: center; }
  .result-type { display: inline-block; padding: 6px 20px; border-radius: 50px; font-size: 13px; font-weight: 600; letter-spacing: 1px; margin-bottom: 16px; }
  .result-type.stay { background: #e8f0fa; color: var(--stay); }
  .result-type.go { background: #fef0ec; color: var(--go); }
  .result-type.swing { background: #fef8e5; color: #b8860b; }
  .result h2 { font-size: 24px; font-weight: 700; margin-bottom: 8px; line-height: 1.4; }
  .result .score-bar-wrap { width: 100%; max-width: 300px; margin: 16px auto 24px; }
  .result .score-labels { display: flex; justify-content: space-between; font-size: 12px; color: var(--sub); margin-bottom: 4px; }
  .result .score-bar-bg { height: 8px; background: var(--progress-bg); border-radius: 4px; overflow: hidden; display: flex; }
  .result .score-bar-go { background: var(--go); height: 100%; transition: width 0.6s ease; }
  .result .score-bar-stay { background: var(--stay); height: 100%; transition: width 0.6s ease; }
  .result .score-marker { position: relative; height: 20px; margin-top: 2px; }
  .result .score-marker-dot { position: absolute; width: 10px; height: 10px; background: var(--text); border-radius: 50%; transform: translateX(-50%); top: 5px; transition: left 0.6s ease; }
  .result .insight { background: var(--card); border-radius: var(--radius); padding: 20px 24px; text-align: left; line-height: 1.7; font-size: 15px; color: var(--text); box-shadow: var(--shadow); margin-bottom: 12px; }
  .result .insight-title { font-size: 13px; font-weight: 700; color: var(--primary); margin-bottom: 6px; letter-spacing: 1px; text-transform: uppercase; }
  .result .share-hint { font-size: 13px; color: var(--sub); margin: 20px 0 24px; }

  /* Bottom safe area */
  .bottom-safe { height: env(safe-area-inset-bottom, 20px); }
</style>
</head>
<body>
<div class="app" id="app"></div>

<script>
// ── Questions ──
const QUESTIONS = [
  // 维度一：职业发展
  { id:1, dim:"职业发展", q:"你现在的工作，是你喜欢的方向吗？", opts:[
    {text:"很喜欢，这是我的赛道",v:2},{text:"还行，不讨厌也不热爱",v:0},{text:"纯粹为了赚钱，谈不上喜欢",v:-1},{text:"很讨厌，每天都想辞职",v:-2}
  ]},
  { id:2, dim:"职业发展", q:"你觉得在这座城市，你的职业天花板在哪？", opts:[
    {text:"还远着呢，上升空间很大",v:2},{text:"3-5年内还能往上走",v:1},{text:"差不多到顶了，再往上很难",v:-1},{text:"已经没有空间了，在吃老本",v:-2}
  ]},
  { id:3, dim:"职业发展", q:"如果你回老家，你的职业技能还能用上吗？", opts:[
    {text:"完全可以用，老家有对应产业",v:-1},{text:"部分能用，需要转一点方向",v:0},{text:"很难用上，老家没有这个行业",v:1},{text:"完全用不上，等于从零开始",v:2}
  ]},
  { id:4, dim:"职业发展", q:"你现在的工作给你带来的成就感是？", opts:[
    {text:"很强，经常觉得自己在创造价值",v:2},{text:"偶尔有，但不多",v:0},{text:"很少，更多是为了完成任务",v:-1},{text:"几乎为零，只是在消耗自己",v:-2}
  ]},
  { id:5, dim:"职业发展", q:"过去一年，你在工作中学到了新东西吗？", opts:[
    {text:"学了很多，一直在进步",v:2},{text:"学了一点，但速度慢了",v:0},{text:"基本没学新东西，在重复劳动",v:-1},{text:"不但没学，感觉在退步",v:-2}
  ]},
  // 维度二：家庭约束
  { id:6, dim:"家庭约束", q:"你父母的健康状况如何？", opts:[
    {text:"都很好，不需要我操心",v:1},{text:"有些小毛病，但不严重",v:0},{text:"一方有慢性病，需要定期照顾",v:-1},{text:"一方或双方情况不太好，我经常担心",v:-2}
  ]},
  { id:7, dim:"家庭约束", q:"你是独生子女吗？", opts:[
    {text:"不是，有兄弟姐妹能分担",v:1},{text:"是独生，但父母很独立，不需要我操心",v:0},{text:"是独生，父母嘴上不说但我知道他们需要我",v:-1},{text:"是独生，父母已经明确希望我回去",v:-2}
  ]},
  { id:8, dim:"家庭约束", q:"你老家和现在城市之间，往返需要多长时间？", opts:[
    {text:"高铁1小时以内，随时能回",v:-1},{text:"高铁2-4小时",v:0},{text:"高铁4小时以上或需要飞机",v:1},{text:"跨省很远，回一次要一整天",v:2}
  ]},
  { id:9, dim:"家庭约束", q:"你有没有想过——如果父母突然生病，你多久能赶到？", opts:[
    {text:"完全没想过",v:0},{text:"想过，但觉得暂时不用太担心",v:0},{text:"想过，而且这件事让我经常焦虑",v:-1},{text:"已经发生过类似情况，当时急死了但赶不回去",v:-2}
  ]},
  { id:10, dim:"家庭约束", q:"过年回家离开的时候，你什么感觉？", opts:[
    {text:"没啥感觉，正常回去上班",v:0},{text:"尽量多待几天，但不超过10天",v:0},{text:"每次离开的时候都不太舍得",v:-1},{text:"每次都拖到最后一天，想到回去上班就难受",v:-2}
  ]},
  // 维度三：情感归属
  { id:11, dim:"情感归属", q:"你现在有伴侣吗？你们在同一个城市吗？", opts:[
    {text:"有伴侣，在同一个城市",v:1},{text:"有伴侣，异地，但有明确的结束计划",v:0},{text:"有伴侣，异地，不知道什么时候结束",v:-1},{text:"没有伴侣，我一个人",v:0}
  ]},
  { id:12, dim:"情感归属", q:"在这座城市，你有多少可以随时叫出来的朋友？", opts:[
    {text:"5个以上，社交圈很稳定",v:2},{text:"2-4个，够用了",v:1},{text:"1个，而且还不一定有空",v:0},{text:"几乎没有，大部分时间一个人",v:-1}
  ]},
  { id:13, dim:"情感归属", q:"周末或下班后，你通常怎么过？", opts:[
    {text:"活动很丰富，经常有安排",v:2},{text:"偶尔约朋友，大多数时候自己待着",v:0},{text:"基本都在家，刷手机追剧打游戏",v:-1},{text:"想出去但不知道去哪，也不知道找谁",v:-2}
  ]},
  { id:14, dim:"情感归属", q:"你觉得这座城市让你有"家"的感觉吗？", opts:[
    {text:"有，这里就是我的家",v:2},{text:"有一点归属感，但还不够",v:0},{text:"没有，住了几年还是觉得自己是外地人",v:-1},{text:"完全没有，我只是在这里打工而已",v:-2}
  ]},
  { id:15, dim:"情感归属", q:"如果用一个词形容你在这座城市的感受，最接近的是？", opts:[
    {text:"兴奋——有无限可能",v:2},{text:"充实——忙但值得",v:1},{text:"疲惫——有点撑不住了",v:-1},{text:"孤独——热闹是他们的，我什么都没有",v:-2}
  ]},
  // 维度四：财务现实
  { id:16, dim:"财务现实", q:"去掉房租和生活必要开支，你每月能存下多少？", opts:[
    {text:"收入的40%以上",v:2},{text:"收入的20%-40%",v:1},{text:"收入的10%-20%",v:0},{text:"基本存不下或月光",v:-1}
  ]},
  { id:17, dim:"财务现实", q:"你有在这座城市买房的计划或可能性吗？", opts:[
    {text:"已经买了",v:3},{text:"3年内有计划，首付差不多了",v:2},{text:"想过，但遥遥无期",v:0},{text:"完全不可能，想都不敢想",v:-2}
  ]},
  { id:18, dim:"财务现实", q:"如果你回老家，你的收入会变化多少？", opts:[
    {text:"收入会涨或基本不变",v:-1},{text:"会降20%-30%，但生活成本也降了",v:0},{text:"会降30%-50%，生活质量可能会下降",v:1},{text:"会腰斩甚至更多",v:2}
  ]},
  { id:19, dim:"财务现实", q:"你觉得你现在的生活质量，和老家同龄人相比？", opts:[
    {text:"比他们好很多",v:1},{text:"好一点，但代价也大",v:0},{text:"差不多，甚至他们更舒服",v:-1},{text:"不如他们——他们房子买了车有了",v:-2}
  ]},
  { id:20, dim:"财务现实", q:"你有没有认真算过留vs回两边的经济账？", opts:[
    {text:"算过，留更划算",v:1},{text:"算过，回更划算",v:-1},{text:"想过算，但一直没真正算",v:0},{text:"没算过，不敢算",v:0}
  ]},
  // 维度五：内心倾向
  { id:21, dim:"内心倾向", q:"夜深人静的时候，你更常想的是什么？", opts:[
    {text:"怎么把工作做得更好，怎么升职加薪",v:1},{text:"周末去哪玩，明天吃什么",v:0},{text:"这么累到底是为了什么",v:-1},{text:"要是能回去就好了",v:-2}
  ]},
  { id:22, dim:"内心倾向", q:"你觉得"回老家"这个念头，在你心里压了多久了？", opts:[
    {text:"从来没想过，我就是要在这",v:2},{text:"最近才开始想",v:0},{text:"半年到一年了",v:-1},{text:"一年以上了，越来越强烈",v:-2}
  ]},
  { id:23, dim:"内心倾向", q:"如果有人告诉你"你这辈子就留在这座城市了"，你的第一反应是？", opts:[
    {text:"太好了，这就是我要的",v:2},{text:"还行吧，可以接受",v:1},{text:"有点慌，不确定",v:-1},{text:"不要——我不要一辈子待在这里",v:-2}
  ]},
  { id:24, dim:"内心倾向", q:"你觉得自己属于哪里？", opts:[
    {text:"属于现在这座城市",v:2},{text:"一半属于这里，一半属于老家",v:0},{text:"更属于老家——这里只是临时的",v:-1},{text:"哪里都不属于，我夹在中间",v:-1}
  ]},
  { id:25, dim:"内心倾向", q:"撇开所有现实因素——钱、工作、父母、伴侣——你内心最想待在哪？", opts:[
    {text:"现在这座城市",v:2},{text:"不一定这里，但肯定是一座大城市",v:1},{text:"老家或离老家近一点的地方",v:-1},{text:"一个谁都不认识我的小地方",v:-1}
  ]},
];

// ── State ──
let currentQ = 0, answers = [], totalScore = 0;

// ── Render ──
const app = document.getElementById('app');

function renderLanding() {
  app.innerHTML = `
    <div class="page active landing">
      <div class="landing-icon">🏙️</div>
      <h1>去还是留？<br>城市选择测试</h1>
      <p class="sub">35道题，帮你面对那个压了很久的问题：</p>
      <p class="sub" style="font-weight:600;color:var(--text)">"我到底该留在大城市，还是回老家？"</p>
      <p class="hint">· 不是性格测试 · 不是娱乐闯关 · 是帮你想清楚 ·</p>
      <div class="stats">
        <div><div class="stat-num">35</div><div class="stat-label">道深度问题</div></div>
        <div><div class="stat-num">5</div><div class="stat-label">个维度分析</div></div>
        <div><div class="stat-num">3min</div><div class="stat-label">完成测试</div></div>
      </div>
      <button class="btn btn-primary" onclick="startQuiz()">开始测试</button>
      <p style="font-size:12px;color:#b0a89a;margin-top:12px;">已经帮几万人想清楚这个问题</p>
      <div class="bottom-safe"></div>
    </div>`;
}

function renderQuestion(idx) {
  const q = QUESTIONS[idx];
  const progress = Math.round((idx / QUESTIONS.length) * 100);
  const selectedVal = answers[idx] !== undefined ? answers[idx] : -1;
  app.innerHTML = `
    <div class="progress-wrap">
      <div class="progress-bar"><div class="progress-fill" style="width:${progress}%"></div></div>
      <div class="progress-text">${idx + 1} / ${QUESTIONS.length}</div>
    </div>
    <div class="page active">
      <div class="q-card">
        <div class="q-num">${q.dim} · 第${idx+1}题</div>
        <div class="q-text">${q.q}</div>
        <div class="q-options" id="options-${idx}">
          ${q.opts.map((o,i) => `
            <button class="q-opt${i === selectedVal ? ' selected' : ''}" data-idx="${i}" onclick="selectAnswer(${idx}, ${i})">${o.text}</button>
          `).join('')}
        </div>
      </div>
      <div style="display:flex;justify-content:space-between;margin-top:20px;gap:12px;">
        ${idx > 0 ? '<button class="btn" style="background:var(--card);border:1.5px solid var(--divider);color:var(--text);flex:1;padding:12px;" onclick="prevQ()">← 上一题</button>' : '<div style="flex:1"></div>'}
        <button class="btn btn-primary" style="flex:1;padding:12px;" onclick="nextQ()" ${answers[idx]===undefined?'disabled':''} id="nextBtn-${idx}">
          ${idx < QUESTIONS.length - 1 ? '下一题 →' : '查看结果 ✨'}
        </button>
      </div>
      <div class="bottom-safe"></div>
    </div>`;
}

function selectAnswer(qIdx, optIdx) {
  answers[qIdx] = optIdx;
  renderQuestion(qIdx);
}

function prevQ() {
  if (currentQ > 0) { currentQ--; renderQuestion(currentQ); window.scrollTo(0,0); }
}

function nextQ() {
  if (answers[currentQ] === undefined) return;
  if (currentQ < QUESTIONS.length - 1) {
    currentQ++;
    renderQuestion(currentQ);
    window.scrollTo(0,0);
  } else {
    showResult();
  }
}

function startQuiz() {
  currentQ = 0; answers = []; totalScore = 0;
  renderQuestion(0);
  window.scrollTo(0,0);
}

function calcScore() {
  totalScore = 0;
  QUESTIONS.forEach((q, i) => {
    if (answers[i] !== undefined) totalScore += q.opts[answers[i]].v;
  });
  return totalScore;
}

function getResult(score) {
  if (score >= 20) return {
    type:'stay', label:'扎根型', emoji:'🏙️',
    title:'你的答案是：留下来',
    desc:'你的内心和现实条件都支持你留在大城市。你可能偶尔会累、会动摇，但那不是真的想走——那只是需要休息的信号。',
    tips:['你的职业在大城市还有很大的上升空间，别因为一时疲惫放弃','如果焦虑来自孤独，可以把"社交"当作一个需要主动经营的项目','给父母多打视频电话，远程陪伴也可以很实在']
  };
  if (score >= 6) return {
    type:'stay', label:'偏向留下', emoji:'🌆',
    title:'你的方向是：先留下，但别硬撑',
    desc:'你整体倾向于留在大城市，但有一些因素在拉扯你——可能是父母的健康、可能是异地恋、可能是经济压力。这些不是让你马上回去的理由，但值得你认真对待。',
    tips:['把那件一直在拉扯你的事列出来，一件一件解决','如果异地是核心问题，和伴侣一起做这个测试，对比答案','给自己一个时间节点：如果XX条件没达到，就重新评估']
  };
  if (score >= -5) return {
    type:'swing', label:'摇摆型', emoji:'⚖️',
    title:'你的答案是：你还没准备好选',
    desc:'你不是纠结——你是真的处于一个势均力敌的状态。留和走的理由各占一半。这种情况下，做任何选择都不算错。关键是：别让"不做决定"本身成为最差的决定。',
    tips:['你需要的不是"选哪个"，而是"什么时候选"——给摇摆设一个截止日期','找2-3个在这座城市和回老家的人都聊一聊，听听他们真实的日子','关注你那道选了极端的题——那可能才是你真实的倾向']
  };
  if (score >= -19) return {
    type:'go', label:'偏向回去', emoji:'🏡',
    title:'你的方向是：回去，是一条值得认真考虑的路',
    desc:'你的内心和现实都在指向回老家/二线城市。你不缺回去的理由，你缺的是"确认"——确认这不是失败，确认回去也能过得很好。',
    tips:['回老家不等于躺平——把你在大城市学到的东西带回去，你可能比留在那里的人更有优势','先研究老家的产业和机会，别凭想象做决定','可以选一个折中方案：新一线或省会城市，兼顾发展和离家近']
  };
  return {
    type:'go', label:'回归型', emoji:'🌅',
    title:'你的答案是：你已经知道了',
    desc:'你内心其实已经有答案了——你只是需要有人帮你说出来。回老家不是失败，是你做了另一个选择。23%的人回老家后15个月内又回了大城市——但你未必是那23%。你更可能是那77%，回去之后发现：原来这才是对的路。',
    tips:['别把回去当成"退路"，把它当成"换赛道"——你带着一线城市的经验回去，是降维不是退缩','制定一个具体的"回去计划"：什么时候、去哪、做什么','你最舍不得这座城市的那些东西，有些可以带走，有些可以换种方式拥有']
  };
}

function showResult() {
  const score = calcScore();
  const r = getResult(score);
  const maxPossible = QUESTIONS.reduce((sum,q)=>sum+Math.max(...q.opts.map(o=>o.v)),0);
  const minPossible = QUESTIONS.reduce((sum,q)=>sum+Math.min(...q.opts.map(o=>o.v)),0);
  const goPercent = Math.round(((score - minPossible) / (maxPossible - minPossible)) * 100);
  const stayPercent = 100 - goPercent;

  app.innerHTML = `
    <div class="page active result">
      <div class="result-type ${r.type}">${r.label}${r.emoji}</div>
      <h2>${r.title}</h2>
      <div class="score-bar-wrap">
        <div class="score-labels"><span>← 回老家</span><span>留在大城市 →</span></div>
        <div class="score-bar-bg">
          <div class="score-bar-go" style="width:${goPercent}%"></div>
          <div class="score-bar-stay" style="width:${stayPercent}%"></div>
        </div>
      </div>
      <div class="insight">
        <div class="insight-title">💡 你的画像</div>
        ${r.desc}
      </div>
      ${r.tips.map((t,i) => `
        <div class="insight">
          <div class="insight-title">${i === 0 ? '🎯' : i === 1 ? '📌' : '💪'} 建议${i+1}</div>
          ${t}
        </div>
      `).join('')}
      <p class="share-hint">📱 截图保存你的结果，或者分享给那个也在纠结的朋友</p>
      <button class="btn btn-primary" onclick="startQuiz()">再测一次</button>
      <button class="btn" style="background:var(--card);border:1.5px solid var(--divider);color:var(--text);margin-top:10px;padding:12px 32px;font-size:15px;" onclick="shareResult()">📤 分享结果</button>
      <div class="bottom-safe"></div>
    </div>`;
  window.scrollTo(0,0);
}

function shareResult() {
  const score = calcScore();
  const r = getResult(score);
  const text = `我在「去还是留？城市选择测试」中测出来是「${r.label}」——${r.title}\n\n你也来测测：该留在大城市，还是回老家？`;
  if (navigator.share) {
    navigator.share({ title: '去还是留？城市选择测试', text }).catch(()=>{});
  } else {
    navigator.clipboard.writeText(text).then(() => alert('结果已复制，去分享给朋友吧！')).catch(()=>{});
  }
}

// Init
renderLanding();
</script>
</body>
</html>
