<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#1a1a2e">
<title>去还是留？城市选择测试</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f5f0eb;
    --card: #ffffff;
    --text: #2c2c2c;
    --sub: #7a7a7a;
    --primary: #e07a5f;
    --primary-dark: #c9654b;
    --stay: #3d5a80;
    --go: #ee6c4d;
    --progress-bg: #e8ddd0;
    --divider: #ede6dc;
    --shadow: 0 2px 20px rgba(0,0,0,0.05);
    --radius: 18px;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100dvh;
    display: flex;
    justify-content: center;
    -webkit-font-smoothing: antialiased;
  }
  .app { width: 100%; max-width: 800px; min-height: 100dvh; position: relative; overflow-x: hidden; }

  /* Progress */
  .progress-wrap { padding: 28px 28px 0; }
  .progress-bar { height: 5px; background: var(--progress-bg); border-radius: 3px; overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--stay), var(--primary), var(--go)); border-radius: 3px; transition: width 0.4s ease; width: 0%; }
  .progress-text { text-align: right; font-size: 14px; color: var(--sub); margin-top: 8px; }

  /* Pages */
  .page { display: none; flex-direction: column; padding: 0 28px 40px; animation: fadeSlideIn 0.3s ease; }
  .page.active { display: flex; }
  @keyframes fadeSlideIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

  /* Landing */
  .landing { text-align: center; padding-top: 80px; align-items: center; }
  .landing-icon { font-size: 64px; margin-bottom: 20px; }
  .landing h1 { font-size: 30px; font-weight: 700; line-height: 1.4; margin-bottom: 12px; color: var(--text); }
  .landing .sub { font-size: 17px; color: var(--sub); line-height: 1.7; margin-bottom: 8px; }
  .landing .hint { font-size: 14px; color: #b0a89a; margin-bottom: 36px; }
  .landing .stats { display: flex; gap: 32px; justify-content: center; margin-bottom: 40px; }
  .landing .stat-num { font-size: 32px; font-weight: 700; color: var(--primary); }
  .landing .stat-label { font-size: 13px; color: var(--sub); margin-top: 4px; }

  /* Buttons */
  .btn {
    display: inline-block; padding: 16px 44px; border-radius: 50px; font-size: 18px; font-weight: 600;
    border: none; cursor: pointer; transition: all 0.15s; text-align: center; letter-spacing: 0.5px;
    -webkit-tap-highlight-color: transparent; user-select: none;
  }
  .btn:active { transform: scale(0.97); }
  .btn-primary { background: var(--primary); color: #fff; box-shadow: 0 4px 16px rgba(224,122,95,0.3); }
  .btn-primary:hover { background: var(--primary-dark); }
  .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; box-shadow: none; }
  .btn-primary:disabled:active { transform: none; }

  /* Question Card */
  .q-card { background: var(--card); border-radius: var(--radius); padding: 36px 28px 28px; box-shadow: var(--shadow); }
  .q-num { font-size: 13px; color: var(--sub); letter-spacing: 1px; margin-bottom: 14px; }
  .q-text { font-size: 18px; font-weight: 600; line-height: 1.7; margin-bottom: 28px; color: var(--text); text-wrap: pretty; }
  .q-options { display: flex; flex-direction: column; gap: 12px; }
  .q-opt {
    display: block; width: 100%; padding: 16px 20px; border: 2px solid var(--divider); border-radius: 14px;
    background: var(--card); font-size: 17px; color: var(--text); text-align: left; cursor: pointer;
    transition: border-color 0.15s, background 0.15s; -webkit-tap-highlight-color: transparent; line-height: 1.5; text-wrap: pretty;
  }
  .q-opt:active { border-color: var(--primary); background: #fef8f5; }
  .q-opt.selected { border-color: var(--primary); background: #fef3ee; font-weight: 500; }

  /* Results */
  .result { text-align: center; padding-top: 40px; align-items: center; }
  .result-type { display: inline-block; padding: 8px 24px; border-radius: 50px; font-size: 15px; font-weight: 600; letter-spacing: 1px; margin-bottom: 20px; }
  .result-type.stay { background: #e8f0fa; color: var(--stay); }
  .result-type.go { background: #fef0ec; color: var(--go); }
  .result-type.swing { background: #fef8e5; color: #b8860b; }
  .result h2 { font-size: 26px; font-weight: 700; margin-bottom: 12px; line-height: 1.4; }
  .result .score-bar-wrap { width: 100%; max-width: 440px; margin: 16px auto 28px; }
  .result .score-labels { display: flex; justify-content: space-between; font-size: 13px; color: var(--sub); margin-bottom: 6px; }
  .result .score-bar-bg { height: 28px; background: var(--progress-bg); border-radius: 6px; overflow: hidden; display: flex; position: relative; }
  .result .score-bar-go { background: var(--go); height: 100%; transition: width 0.6s ease; display: flex; align-items: center; justify-content: center; min-width: 0; }
  .result .score-bar-stay { background: var(--stay); height: 100%; transition: width 0.6s ease; display: flex; align-items: center; justify-content: center; min-width: 0; }
  .result .score-bar-pct { font-size: 11px; font-weight: 700; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,0.2); white-space: nowrap; }
  .result .insight { background: var(--card); border-radius: var(--radius); padding: 24px 28px; text-align: left; line-height: 1.8; font-size: 16px; color: var(--text); box-shadow: var(--shadow); margin-bottom: 14px; }
  .result .insight-title { font-size: 18px; font-weight: 700; color: var(--text); margin-bottom: 10px; border-left: 4px solid var(--primary); padding-left: 14px; }
  .result .share-hint { font-size: 14px; color: var(--sub); margin: 24px 0 28px; }

  /* Sticky nav for questions */
  .q-nav { position: sticky; bottom: 0; background: var(--bg); padding: 16px 0 20px; z-index: 10; display: flex; justify-content: space-between; gap: 12px; }

  /* Desktop: center the app with a subtle card feel */
  @media (min-width: 768px) {
    body { background: #ede6dc; padding: 40px 0; align-items: flex-start; }
    .app {
      max-width: 720px; min-height: auto; background: var(--bg); border-radius: 16px;
      box-shadow: 0 4px 30px rgba(0,0,0,0.08); margin: 0 16px;
    }
  }
</style>
</head>
<body>
<div class="app" id="app"></div>

<script>
// ── Questions ──
const QUESTIONS = [

  // ══════════════════════════════════════
  // 维度一：身份的撕裂
  // ══════════════════════════════════════

  { id:1, dim:"身份的撕裂", q:"你在大城市的朋友圈和在老家的朋友圈，聊的话题、关心的事、对“好生活”的定义，完全是两个世界。你发现自己在这两个世界之间切换时，越来越像在扮演两个不同的人。哪一个版本的你，更接近真实的自己？", opts:[
    {text:"大城市版本的我才是真的我——独立、专业、不靠关系靠能力",v:2},
    {text:"两个版本都是我，只是不同场合的不同侧面，并不矛盾",v:1},
    {text:"越来越不确定了。有时候回老家反而觉得更自在",v:-1},
    {text:"老家的我才是真的我。大城市的我一直在演一个“厉害的人”，好累",v:-2}
  ]},
  { id:2, dim:"身份的撕裂", q:"有人随口问你“你是哪里人”。你停顿了一下——说现在这座城市吧，你没有户口没有房，在这住了五年依然是个“外地人”；说老家吧，你已经离开太久了，回去连路都认不全，同学的名字都要想一下才记得。这个停顿里，藏着你最大的身份困境。你通常怎么回答这个问题？", opts:[
    {text:"直接说现在这座城市——我心里已经把这里当作家了",v:2},
    {text:"说“我是XX人，现在在XX工作”——两句话都要说，因为一句话说不清",v:0},
    {text:"说完老家地名之后，会忍不住加一句“但在外面很多年了”——好像在解释什么",v:-1},
    {text:"每次被问到都会愣一下。这个问题越来越不知道怎么回答了",v:-2}
  ]},
  { id:3, dim:"身份的撕裂", q:"过年回老家参加同学聚会。他们聊孩子上学、装修房子、单位里的人情世故。你发现你插不上嘴——不是不想聊，是你每天脑子里装的是OKR、是跳槽涨薪、是下个迭代的deadline。他们说的那些“生活”，对你来说像另一个星球的事。那一刻你心里的感受是？", opts:[
    {text:"庆幸自己没被困在那个小世界里，我的人生比他们宽广得多",v:2},
    {text:"有一点疏离感，但也尊重他们的选择——每个人要的东西不一样",v:0},
    {text:"心里有点慌：他们过的才是“正常人的生活”，而我这些年到底在忙什么？",v:-1},
    {text:"沉默了很久。突然觉得他们才是活明白了的人，我只是在漂泊",v:-2}
  ]},
  { id:4, dim:"身份的撕裂", q:"你在这座城市认识的人里，有多少知道你的真名（不是花名/英文名）？有多少来过你住的地方？有多少知道你老家在哪、家里几口人、你最怕什么？当你说“回家”的时候，脑子里最先浮现的那个地址——它真的让你有“到家了”的感觉吗？", opts:[
    {text:"我在这里有真正深度的关系，朋友知道我是谁、从哪来、要往哪去",v:2},
    {text:"有一些比较近的朋友，但最深的那些关系还是在老家",v:0},
    {text:"说实话，在这座城市没有一个人真正了解完整的我",v:-1},
    {text:"当我脱口而出“回家”时，脑子里出现的是老家的地址——每一次都是",v:-2}
  ]},
  { id:5, dim:"身份的撕裂", q:"你在这座城市换了几次出租屋，每次搬家你都跟自己说“下次一定搬进自己的房子”。几年过去了，你还是没有一把属于自己的钥匙。租来的房子，墙上的挂钩你犹豫了很久才敢贴——因为你知道这不是你的墙。你在这座城市的根，扎了多深？", opts:[
    {text:"根已经很深了。租房不代表没有生活，我把这里经营得像家一样",v:2},
    {text:"有一些根——熟悉这片街区，有几个固定的去处，但离“扎根”还远",v:0},
    {text:"没什么根。随时可以打包走，没有什么是不能放弃的",v:-1},
    {text:"根不在这里也不在老家。我是浮萍，漂着漂着已经习惯了",v:-2}
  ]},

  // ══════════════════════════════════════
  // 维度二：时间的重量
  // ══════════════════════════════════════

  { id:6, dim:"时间的重量", q:"算一笔时间账。你一年回老家几次？每次待几天？父母现在多少岁？用中国人均寿命减一下，再除以你每年见他们的次数。算完那个数字之后——你们还能见面的次数——你的感受最接近下面哪一种？", opts:[
    {text:"算过，那个数字让我意识到要珍惜，但不会因此改变我的人生轨迹",v:1},
    {text:"算过，尽量多回去几次，多打视频——尽量在现有框架里做最大努力",v:0},
    {text:"算完之后沉默了很久。但第二天还是照常上班了——假装没算过",v:-1},
    {text:"那个数字是我所有焦虑的根源。每次想起来都觉得对不起他们",v:-2}
  ]},
  { id:7, dim:"时间的重量", q:"你在这座城市投入的年份——3年、5年、10年——这些时间变成了你的简历、你的人脉、你对这座城市的肌肉记忆。如果现在离开，这些“沉没成本”有多少能带走？你更在意的，是那个回不来的时间，还是那个可能更好的未来？", opts:[
    {text:"不是沉没成本——这些年塑造了现在的我，去哪都能带走",v:2},
    {text:"有一部分确实是沉没了，但整体是赚的，比不来强",v:1},
    {text:"说实话，有时候觉得这些投入只在这座城市才有价值，回去了就归零了",v:-1},
    {text:"想到“走了这些都白费了”就不敢走。但留下来又觉得在继续浪费更多时间",v:-2}
  ]},
  { id:8, dim:"时间的重量", q:"有一种说法——“30岁之前在大城市拼，30岁之后回二线安家”。你现在离自己设定的那个“该做决定的年龄”还有多远？那个时间节点，是你自己想清楚的节奏，还是社会塞给你的剧本？", opts:[
    {text:"没有什么deadline。我不按别人的时间表活，每个阶段都是我自己的选择",v:2},
    {text:"有一个模糊的时间范围，但那是我结合自己的情况想的，不是别人强加的",v:0},
    {text:"说实话，那个deadline主要是社会舆论给的——过了某个年纪还在漂，就会被问",v:-1},
    {text:"Deadline早就过了。每天都在焦虑，感觉自己错过了“该回去”的最佳时机",v:-2}
  ]},
  { id:9, dim:"时间的重量", q:"你有没有发现一个规律——每年你都说“再干一年就回去”。去年说了，今年又说了一遍。你是在积累回去的资本，还是只是在推迟一个你不敢做的决定？对自己诚实一点。", opts:[
    {text:"不是在推迟。我确实在积累——钱、经验、人脉。每年都比上一年更有底气",v:2},
    {text:"一半一半。积累是真的，但确实也在用积累当借口来逃避决定",v:0},
    {text:"可能是后者。每次想说“该走了”，又觉得再等等会更好——但真的会更好吗",v:-1},
    {text:"就是在推迟。我知道自己不敢做决定，所以一直用“还没准备好”来骗自己",v:-2}
  ]},
  { id:10, dim:"时间的重量", q:"如果你的人生是一部电影，现在这个阶段是第几幕？观众看到这里，会觉得主角应该继续在这座城市战斗，还是应该换一个舞台？而你——作为导演兼主演——你自己想让下一幕从哪里开始？", opts:[
    {text:"第二幕刚开场——精彩的部分还在后面，而且一定是在这座城市",v:2},
    {text:"还在铺垫阶段，下一幕在哪取决于接下来一两年的走势",v:0},
    {text:"感觉第一幕拖得太长了——该转场了，观众都快没耐心了",v:-1},
    {text:"这部电影需要一个新的场景。现在的场景里主角已经走不动了",v:-2}
  ]},

  // ══════════════════════════════════════
  // 维度三：羁绊的拉扯
  // ══════════════════════════════════════

  { id:11, dim:"羁绊的拉扯", q:"你的城市选择从来不只是你一个人的事。你在乎的人——伴侣、父母、最好的朋友——他们各自希望你待在哪里？如果他们的愿望互相矛盾，你内心优先听谁的声音？不是“应该”听谁的，是真的听了谁的。", opts:[
    {text:"我优先听我自己的。他们的意见我会参考，但最终这是我的命",v:2},
    {text:"伴侣的意见最重要——我们是要一起过日子的人，城市必须一起决定",v:0},
    {text:"父母的意见分量最重。他们给了我一切，我不忍心让他们失望",v:-1},
    {text:"我被这些声音撕扯得太厉害了，以至于听不到自己的声音",v:-2}
  ]},
  { id:12, dim:"羁绊的拉扯", q:"异地恋最让人绝望的不是见不到面——是你们的“未来”被两座城市撕成了两个版本。你在你的城市规划未来，ta在ta的城市规划未来，两条线永远交不到同一个点。你们认真聊过这个问题的次数——是零次、一次、还是每次聊都无疾而终？", opts:[
    {text:"没有异地问题——要么同城，要么没有伴侣，不涉及这个拉扯",v:1},
    {text:"聊过好几次，有大致的方向和时间表，只是还没到执行那一步",v:0},
    {text:"聊过一次，气氛不太好，后来就默契地不聊了——好像不聊就不会出事",v:-1},
    {text:"每次想聊，话到嘴边又咽回去。因为知道答案可能不是自己想听的",v:-2}
  ]},
  { id:13, dim:"羁绊的拉扯", q:"父母从来不直接说“你回来吧”。他们说“你忙你的，我们没事”。但你知道他们把你的房间留着，每周打扫一次，你的床单还是你高中那条。你觉得自己欠他们一个“回去”，还是欠自己一个“留下”？", opts:[
    {text:"不觉得欠任何人。我的人生是我自己的，他们希望我好，而不是希望我回去",v:2},
    {text:"有一点愧疚，但还可以承受。我会用自己的方式补偿他们",v:0},
    {text:"很愧疚。每次看到他们的照片、每次挂完电话，都会想“我是不是太自私了”",v:-1},
    {text:"两笔债都在身上——欠他们的陪伴，也欠自己一个不被愧疚绑架的选择",v:-2}
  ]},
  { id:14, dim:"羁绊的拉扯", q:"你在这座城市最好的朋友突然告诉你——ta要走了，回老家，或者去另一个城市。你嘴上说“恭喜你啊”，但心里还有一个声音：ta走了之后，我还剩什么理由留在这里？如果你的“战友”一个一个离开，你还会觉得这座城市值得你一个人战斗吗？", opts:[
    {text:"朋友来来走走很正常——我不是因为谁才留在这里的，我是为了自己",v:2},
    {text:"会有一点失落，但不会动摇我的决定。我还是有我的理由",v:0},
    {text:"说实话，如果身边的人都走了，我会开始认真想“我是不是也该走了”",v:-1},
    {text:"已经经历过这种事了。每走一个人，我就更动摇一点",v:-2}
  ]},
  { id:15, dim:"羁绊的拉扯", q:"如果你回老家，你需要重新建立整个社交圈——而老家的社交圈靠的不是兴趣和价值观，是亲戚、是同学、是你爸妈认识谁。在那个世界里，你首先是“谁的儿子/女儿”，其次才是“你”。你准备好回到一个你的个人身份退居二线的社交网络里了吗？", opts:[
    {text:"我不会回老家生活，所以这个问题不存在——这也是我留下的原因之一",v:2},
    {text:"不太适应，但可以慢慢经营——大不了在老家也做自己",v:0},
    {text:"这就是我最怕的。在大城市我建立了独立的身份，回去就全没了",v:-1},
    {text:"已经能想象到了——被催婚、被比较、被安排。光想想就窒息",v:-2}
  ]},

  // ══════════════════════════════════════
  // 维度四：恐惧的真相
  // ══════════════════════════════════════

  { id:16, dim:"恐惧的真相", q:"诚实地面对自己：你更怕的是哪一种结局？——怕的是回去之后发现，当初离开是对的，可你再也回不来了。还是怕的是留下来继续拼了十年之后发现，你赌上青春换来的东西根本不值得，而回老家也已经没有你的位置了。哪种恐惧更让你半夜睡不着？", opts:[
    {text:"两个都不太怕。我对自己的选择有信心，每条路都有代价，我愿意承担",v:2},
    {text:"更怕第二种——怕付出没有回报。第一种还可以接受，回去不丢人",v:0},
    {text:"更怕第一种——怕回去之后后悔，却已经没有退路了。那会把我吞噬",v:-1},
    {text:"两个都怕。所以一直不做决定——因为不管选哪个，都有无法承受的后果",v:-2}
  ]},

// State
let currentQ = 0, answers = [];
const app = document.getElementById('app');

function renderLanding() {
  app.innerHTML = '<div class="page active landing">'
    + '<div class="landing-icon">🏙️</div>'
    + '<h1>去还是留？<br>城市选择测试</h1>'
    + '<p class="sub">30道深度问题，帮你面对那个压了很久的问题：</p>'
    + '<p class="sub" style="font-weight:600;color:var(--text)">"我到底该留在大城市，还是回老家？"</p>'
    + '<p class="hint">· 不是性格测试 · 不是娱乐闯关 · 每一题都在问你不敢问自己的事 ·</p>'
    + '<div class="stats">'
    + '<div><div class="stat-num">30</div><div class="stat-label">道灵魂拷问</div></div>'
    + '<div><div class="stat-num">5</div><div class="stat-label">个深层维度</div></div>'
    + '<div><div class="stat-num">6min</div><div class="stat-label">认真做完</div></div>'
    + '</div>'
    + '<button class="btn btn-primary" onclick="startQuiz()">开始测试</button>'
    + '<div class="bottom-safe"></div>'
    + '</div>';
}

function renderQuestion(idx) {
  var q = QUESTIONS[idx];
  var progress = Math.round((idx / QUESTIONS.length) * 100);
  var selectedIdx = answers[idx] !== undefined ? answers[idx] : -1;
  var optsHTML = q.opts.map(function(o,i){
    return '<button class="q-opt' + (i===selectedIdx?' selected':'') + '" data-opt="' + i + '"><b>' + 'ABCD'[i] + '.</b> ' + o.text + '</button>';
  }).join('');
  var prevHTML = idx > 0 ? '<button class="btn" style="background:var(--card);border:2px solid var(--divider);color:var(--text);flex:1;padding:14px;font-size:16px;" id="prevBtn">← 上一题</button>' : '<div style="flex:1"></div>';
  var nextLabel = idx < QUESTIONS.length - 1 ? '下一题 →' : '查看结果 ✨';

  app.innerHTML = '<div class="progress-wrap">'
    + '<div class="progress-bar"><div class="progress-fill" style="width:' + progress + '%"></div></div>'
    + '<div class="progress-text">' + (idx+1) + ' / ' + QUESTIONS.length + '</div>'
    + '</div>'
    + '<div class="page active">'
    + '<div class="q-card">'
    + '<div class="q-num">' + q.dim + ' · 第' + (idx+1) + '题</div>'
    + '<div class="q-text"><b>' + (idx+1) + '.</b> ' + q.q + '</div>'
    + '<div class="q-options" id="options-' + idx + '">' + optsHTML + '</div>'
    + '</div>'
    + '<div class="q-nav">'
    + prevHTML
    + '<button class="btn btn-primary" style="flex:1;padding:14px;font-size:16px;" id="nextBtn" ' + (selectedIdx===-1?'disabled':'') + '>' + nextLabel + '</button>'
    + '</div>'
    + '<div class="bottom-safe"></div>'
    + '</div>';

  var optsEl = document.getElementById('options-' + idx);
  if (optsEl) {
    optsEl.addEventListener('click', function(e) {
      var btn = e.target.closest('.q-opt');
      if (!btn) return;
      var optIdx = parseInt(btn.dataset.opt);
      optsEl.querySelectorAll('.q-opt').forEach(function(b){ b.classList.remove('selected'); });
      btn.classList.add('selected');
      answers[idx] = optIdx;
      var nb = document.getElementById('nextBtn');
      if (nb) { nb.disabled = false; nb.style.opacity = '1'; }
    });
  }
  var nb = document.getElementById('nextBtn');
  if (nb) {
    nb.addEventListener('click', function() {
      if (answers[idx] === undefined) return;
      if (idx < QUESTIONS.length - 1) { currentQ = idx + 1; renderQuestion(currentQ); window.scrollTo(0,0); }
      else { showResult(); }
    });
  }
  var pb = document.getElementById('prevBtn');
  if (pb) {
    pb.addEventListener('click', function() {
      currentQ = idx - 1; renderQuestion(currentQ); window.scrollTo(0,0);
    });
  }
}

function startQuiz() {
  currentQ = 0; answers = new Array(QUESTIONS.length);
  renderQuestion(0); window.scrollTo(0,0);
}

function calcScore() {
  var s = 0;
  QUESTIONS.forEach(function(q, i) { if (answers[i] !== undefined) s += q.opts[answers[i]].v; });
  return s;
}

  return {

}

function showResult() {
  var score = calcScore();
  var r = getResult(score);
  var maxPossible = QUESTIONS.reduce(function(sum,q){return sum+Math.max.apply(null,q.opts.map(function(o){return o.v}));},0);
  var minPossible = QUESTIONS.reduce(function(sum,q){return sum+Math.min.apply(null,q.opts.map(function(o){return o.v}));},0);
  var goPercent = Math.round(((score - minPossible) / (maxPossible - minPossible)) * 100);
  var stayPercent = 100 - goPercent;

  app.innerHTML = '<div class="page active result">'
    + '<div class="result-type ' + r.type + '">' + r.label + ' ' + r.emoji + '</div>'
    + '<h2>' + r.title + '</h2>'
    + '<div class="score-bar-wrap">'
    + '<div class="score-labels"><span>← 回老家</span><span>留在大城市 →</span></div>'
    + '<div class="score-bar-bg">'
    + '<div class="score-bar-go" style="width:' + goPercent + '%">' + (goPercent >= 12 ? '<span class="score-bar-pct">' + goPercent + '%</span>' : '') + '</div>'
    + '<div class="score-bar-stay" style="width:' + stayPercent + '%">' + (stayPercent >= 12 ? '<span class="score-bar-pct">' + stayPercent + '%</span>' : '') + '</div>'
    + '</div></div>'
    + '<div class="insight"><div class="insight-title">你的画像</div>' + r.desc + '</div>'
    + r.tips.map(function(t,i){ return '<div class="insight"><div class="insight-title">建议' + (i+1) + '</div>' + t + '</div>'; }).join('')
    + '<p class="share-hint">📱 截图保存你的结果，或者分享给那个也在纠结的朋友</p>'
    + '<button class="btn btn-primary" onclick="startQuiz()">再测一次</button>'
    + '<button class="btn" style="background:var(--card);border:2px solid var(--divider);color:var(--text);margin-top:12px;padding:14px 32px;font-size:16px;" onclick="shareResult()">📤 分享结果</button>'
    + '<div class="bottom-safe"></div>'
    + '</div>';
  window.scrollTo(0,0);
}

function shareResult() {
  var score = calcScore();
  var r = getResult(score);
  var text = '我在「去还是留？城市选择测试」中测出来是「' + r.label + '」——' + r.title + '\n\n你也来测测：该留在大城市，还是回老家？';
  if (navigator.share) { navigator.share({ title:'去还是留？城市选择测试', text:text }).catch(function(){}); }
  else { navigator.clipboard.writeText(text).then(function(){ alert('结果已复制，去分享给朋友吧！'); }).catch(function(){}); }
}

// Init
renderLanding();
</script>

</html>
